name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la
          ls -la client/
          java -version
          which java

      - name: Build dex
        run: |
          cd client
          wget -q https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar -O ../smali.jar
          java -jar ../smali.jar assemble discord_9.9.5/smali -o work/classes.dex
          java -jar ../smali.jar assemble discord_9.9.5/smali_classes2 -o work/classes2.dex
          ls -lh work/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dex-files
          path: client/work/*.dex
